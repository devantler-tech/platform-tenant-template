apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production: the shared base plus what only production runs — its public
# route, disruption budget, and anything holding a production credential or
# secret path. The platform reconciles this through ../kustomization.yaml.
resources:
  - ../base
  - poddisruptionbudget.yaml # drain-safe maxUnavailable:1 PDB so node drains never deadlock (platform#1882)
  - httproute.yaml
  # OpenBao-backed secrets via External Secrets — delete both if you need none:
  - secretstore.yaml
  - externalsecret.yaml
