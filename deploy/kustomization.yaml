apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production entry point. The platform reconciles the published manifests
# artifact at `path: .`, which is this file, so it must only include ./prod.
# Shared manifests live in ./base, production-only ones in ./prod, and the dev
# overlay in ./dev (reconciled at `path: ./dev` into the `<tenant>-dev`
# namespace).
resources:
  - prod
