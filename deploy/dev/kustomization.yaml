apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Dev: the shared base, changed only by the patches below. The platform
# reconciles it at `path: ./dev` into its own `<tenant>-dev` namespace and owns
# its ingress behind sign-on, so dev carries no public route, disruption
# budget, or production secret path. Change base objects with patches here;
# never copy a manifest.
resources:
  - ../base
# One replica, whatever production runs.
replicas:
  - name: app
    count: 1
patches:
  # Keep the single dev replica clear of the platform's replica-floor audit
  # even after you remove this label from the base for production HA.
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: add
        path: /metadata/labels/platform.devantler.tech~1replica-floor
        value: exempt
