# This stack's Dependabot entries. scripts/scaffold.sh appends the list below to
# .github/dependabot.yml; this file is never a Dependabot configuration of its own.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # svelte-check and typescript-eslint declare a TypeScript peer range below 7, so a
      # TypeScript 7 update cannot install. Remove this once both accept TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7
