# This stack's Dependabot entries. scripts/scaffold.sh appends the list below to
# .github/dependabot.yml; this file is never a Dependabot configuration of its own.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
