# The .NET stack's CI job. scripts/scaffold.sh copies the `stack` job below into
# .github/workflows/ci.yaml in place of the placeholder job. This file is never
# a workflow of its own: it lives here so Dependabot keeps its pins current.
name: .NET stack job
on: workflow_call
permissions: {}
jobs:
  stack:
    name: .NET
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; proposed code receives no package credential
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sets up the SDK global.json pins, then builds and tests the solution.
      # Warnings are errors, so this also enforces the analyzers and code style.
      - name: 🧪 Build and test
        uses: devantler-tech/.github/actions/run-dotnet-tests@cc156a3693019fdbe9817c46f1a91cd50a124695 # v21.7.3
        with:
          # Public dependencies need no authenticated restore or coverage upload.
          github-token: ""
