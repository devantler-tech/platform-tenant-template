name: 🚀 CD

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish
    # The upstream template has no application to publish; its ID survives renames.
    if: github.repository_id != '1253884448'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: publish-verified-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Publish signed application
        id: publish
        uses: devantler-tech/.github/actions/publish-app@d45338f0ba120e87bdb05c1f70691afe2ec9d2ca # v22.7.5
        with:
          app-name: ${{ github.event.repository.name }}
          app-manifest: ${{ hashFiles('deploy/base/deployment.yaml') != '' && 'base/deployment.yaml' || 'deployment.yaml' }}
