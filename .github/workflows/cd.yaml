name: 🚀 CD

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish
    # Skipped in the template repo itself (it ships no app); runs in every tenant
    # created from this template.
    if: github.repository != 'devantler-tech/platform-tenant-template'
    permissions:
      contents: read # checkout
      packages: write # push image + manifests OCI artifact
      id-token: write # keyless cosign signing (via GitHub OIDC)
    uses: devantler-tech/.github/.github/workflows/publish-app.yaml@467f07582436a26b62cf4aa756423512f85ba0c0 # v8.0.0
    with:
      # publish-app pins the freshly built image digest into the container with
      # this name in deploy/deployment.yaml. Keep that container's name equal to
      # the repository name (the platform's signed-publish convention).
      app-name: ${{ github.event.repository.name }}
      # The signature this publish mints carries the `uses:` ref above in its
      # certificate. Platform has independently approved this exact maintained
      # revision for manifests, admission and node pulls. Other maintained
      # revisions, tags and branches fail closed; a full SHA alone does not
      # grant approval. The guard below checks only that the ref is a commit
      # SHA, so an unapproved SHA still publishes, but its artifact never
      # verifies in-cluster and the tenant silently stops reconciling. Get the
      # new revision approved in Platform before changing this pin.
      #
      # Enabling the guard adds the producer-side half: the publish refuses to
      # sign at all, before the build, so a tag or branch ref surfaces here as a failed
      # release instead of as an artifact the cluster quietly rejects.
      enable-caller-pin: true
