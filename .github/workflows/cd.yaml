name: 🚀 CD

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish
    # Skipped in the template repo itself (it ships no app); runs in every tenant
    # created from this template.
    if: github.repository != 'devantler-tech/platform-tenant-template'
    permissions:
      contents: read # checkout
      packages: write # push image + manifests OCI artifact
      id-token: write # keyless cosign signing (via GitHub OIDC)
    uses: devantler-tech/actions/.github/workflows/publish-app.yaml@8349b0935ade387313cf1a92d17dc068d92daee1 # v13.0.1
    with:
      # publish-app pins the freshly built image digest into the container with
      # this name in deploy/deployment.yaml. Keep that container's name equal to
      # the repository name (the platform's signed-publish convention).
      app-name: ${{ github.event.repository.name }}
      # The signature this publish mints carries the `uses:` ref above in its
      # certificate, and the cluster's OCIRepository rules accept any 40-hex
      # revision of publish-app.yaml. A branch or tag ref would therefore let a
      # superseded revision sign an artifact the cluster still trusts. Requiring
      # a commit SHA is what makes that acceptance safe rather than incidental —
      # the publish fails before signing if this line stops being a SHA pin.
      enable-caller-pin: true
