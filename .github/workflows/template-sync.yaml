name: 🔄 Template Sync

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  template-sync:
    # Skipped in the template repo itself (it is the sync source); runs in every
    # tenant created from this template, where it opens a PR with template changes.
    if: github.repository != 'devantler-tech/platform-tenant-template'
    # The reusable workflow's job opens the sync PR, so the caller must grant it
    # write to contents + pull-requests. A reusable workflow cannot be granted
    # more than the caller, and the top-level `permissions: {}` grants none, so
    # without this the run fails at startup (reusable-workflow permission check)
    # — both here and in every tenant where the job actually runs.
    permissions:
      contents: write
      pull-requests: write
    uses: devantler-tech/.github/.github/workflows/template-sync.yaml@8d3327fe87f216d6e107941de4ce1ae019294cea # v7.9.1
    with:
      source-repo-path: devantler-tech/platform-tenant-template
      use-app-token: true
      # Adds the entries of this template's .templatesyncignore that a tenant's copy lacks,
      # so an exclusion added here also reaches tenants created before it (#171).
      merge-template-ignore-entries: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
