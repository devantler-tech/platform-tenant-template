name: 🔄 Template Sync

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  template-sync:
    # Skipped in the template repo itself (it is the sync source); runs in every
    # tenant created from this template, where it opens a PR with template changes.
    if: github.repository != 'devantler-tech/gitops-tenant-template'
    # The reusable workflow's job opens the sync PR, so the caller must grant it
    # write to contents + pull-requests. A reusable workflow cannot be granted
    # more than the caller, and the top-level `permissions: {}` grants none, so
    # without this the run fails at startup (reusable-workflow permission check)
    # — both here and in every tenant where the job actually runs.
    permissions:
      contents: write
      pull-requests: write
    uses: devantler-tech/actions/.github/workflows/template-sync.yaml@6ae5d87b342984cdaf34740e60366b9d570d8fc5 # v10.2.3
    with:
      source-repo-path: devantler-tech/gitops-tenant-template
      # Required since actions v10.2.3 (#707): App-authored sync PRs are
      # default-off. Without this, GITHUB_TOKEN cannot push template changes that
      # touch `.github/workflows/**` ("refusing to allow a GitHub App to create or
      # update workflow … without `workflows` permission"), so the weekly sync
      # fails whenever the upstream template changes a workflow file.
      use-app-token: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
