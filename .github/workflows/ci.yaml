name: ✅ CI

on:
  pull_request:
    branches: [main]

permissions: {}

# This is an EXAMPLE CI workflow. Replace the `example` job with your stack's
# lint / type-check / test / build jobs, and list every job your tenant adds in
# the `ci-required-checks` aggregator below. Keep `delivery-inputs`: it validates
# the two tenant-owned artifacts that CD publishes. This file is yours to own —
# add it to `.templatesyncignore` so template-sync never overwrites your stack's CI.
jobs:
  workflow-caller-pins:
    name: Workflow caller pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📌 Validate reusable workflow caller pins
        run: sh scripts/workflow-caller-pin-contract.test.sh

  example:
    name: Example
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Placeholder
        run: echo "Replace this job with your stack's lint, test, and build steps."

  delivery-inputs:
    name: Delivery inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; tenant code runs without secrets or write authority
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐳 Build tenant image
        run: docker build --tag tenant-delivery-check .
        shell: bash
        working-directory: .
      - name: 🧱 Render tenant manifests
        run: kubectl kustomize deploy/ >/dev/null
        shell: bash
        working-directory: .

  # A dependency PR that moves the publish-app.yaml pin to a revision the platform has not approved
  # for this tenant would ship a release the platform refuses to deploy, so this job fails the move
  # here instead. An unchanged pin passes without contacting the platform. The template repository
  # itself is not a registered tenant, so it runs the check's tests but skips the check.
  publish-pin-approved:
    name: Publish pin approved
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🧪 Test the publish pin check
        run: sh scripts/publish-pin-approved.test.sh
      - name: 📌 Refuse an unapproved publish-app pin
        if: github.repository != 'devantler-tech/platform-tenant-template'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # An empty base would turn `git show ":path"` into an index read, comparing the head with
          # itself and passing without checking anything.
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::No base commit to compare the publish-app pin against."
            exit 1
          fi
          # Run the check as it exists on the base branch: a PR must not be able to weaken the check
          # that judges it.
          git show "${BASE_SHA}:scripts/publish-pin-approved.sh" >"${RUNNER_TEMP}/publish-pin-approved.sh"
          git show "${BASE_SHA}:.github/workflows/cd.yaml" >"${RUNNER_TEMP}/base-cd.yaml"
          sh "${RUNNER_TEMP}/publish-pin-approved.sh" "${RUNNER_TEMP}/base-cd.yaml" .github/workflows/cd.yaml

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [workflow-caller-pins, example, delivery-inputs, publish-pin-approved]
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/.github/actions/aggregate-job-checks@2fa404276b0ce5c0527683b080e39045045c4e42 # v7.2.10
        with:
          job-results: >-
            ${{ needs.example.result }}
            ${{ needs.delivery-inputs.result }}
            ${{ needs.workflow-caller-pins.result }}
            ${{ needs.publish-pin-approved.result }}
      # aggregate-job-checks deliberately tolerates skipped dependencies. A
      # stable required check must fail unless every named tenant job ran.
      - name: Reject incomplete CI jobs
        if: ${{ needs.workflow-caller-pins.result != 'success' || needs.example.result != 'success' || needs.delivery-inputs.result != 'success' || needs.publish-pin-approved.result != 'success' }}
        run: exit 1
        shell: bash
