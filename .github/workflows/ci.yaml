name: ✅ CI

on:
  pull_request:
    branches: [main]

permissions: {}

# template:begin
# scripts/scaffold.sh shapes this workflow once, when your repository is created:
# it replaces the placeholder `stack` job with the chosen stack's job and, without
# --tenancy, deletes the platform-tenant jobs and their `needs` entries.
# template:end
# This workflow is yours: keep it in `.templatesyncignore` so template-sync never
# overwrites it, and list every job you add under `ci-required-checks.needs`.
jobs:
  # stack:begin
  stack:
    name: Stack
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Placeholder
        run: echo "Replace this job with your stack's lint, test, and build steps."
  # stack:end

  # lint:begin
  # Shared MegaLinter checks for workflows, scripts, Dockerfiles, Markdown, YAML and
  # JSON. Go applications drop this job: the shared Go validator lints them.
  lint:
    name: Lint
    # GitHub's `$/` self-repository form fails actionlint until it supports it
    # (rhysd/actionlint#711); switch then.
    uses: ./.github/workflows/lint.yaml # zizmor: ignore[self-repository]
    permissions:
      contents: read
  # lint:end

  # tenancy:begin
  workflow-caller-pins:
    name: Workflow caller pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📌 Validate reusable workflow caller pins
        run: sh scripts/workflow-caller-pin-contract.test.sh

  # Validates the two tenant-owned artifacts that CD publishes: the image and deploy/.
  delivery-inputs:
    name: Delivery inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; tenant code runs without secrets or write authority
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐳 Build tenant image
        run: docker build --tag tenant-delivery-check .
        shell: bash
        working-directory: .
      - name: 🧱 Render tenant manifests
        run: kubectl kustomize deploy/ >/dev/null
        shell: bash
        working-directory: .

  # A dependency PR that moves the publish-app.yaml pin to a revision the platform has not approved
  # for this tenant would ship a release the platform refuses to deploy, so this job fails the move
  # here instead. An unchanged pin passes without contacting the platform. The template repository
  # itself is not a registered tenant, so it runs the check's tests but skips the check.
  publish-pin-approved:
    name: Publish pin approved
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🧪 Test the publish pin check
        run: sh scripts/publish-pin-approved.test.sh
      - name: 📌 Refuse an unapproved publish-app pin
        # The template repository, matched by its ID so the guard survives renames.
        if: github.repository_id != '1253884448'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # An empty base would turn `git show ":path"` into an index read, comparing the head with
          # itself and passing without checking anything.
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::No base commit to compare the publish-app pin against."
            exit 1
          fi
          # Run the check as it exists on the base branch: a PR must not be able to weaken the check
          # that judges it.
          git show "${BASE_SHA}:scripts/publish-pin-approved.sh" >"${RUNNER_TEMP}/publish-pin-approved.sh"
          git show "${BASE_SHA}:.github/workflows/cd.yaml" >"${RUNNER_TEMP}/base-cd.yaml"
          sh "${RUNNER_TEMP}/publish-pin-approved.sh" "${RUNNER_TEMP}/base-cd.yaml" .github/workflows/cd.yaml
  # tenancy:end

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs:
      - stack
      - lint # lint
      - workflow-caller-pins # tenancy
      - delivery-inputs # tenancy
      - publish-pin-approved # tenancy
    permissions:
      actions: read # native workflow-run metadata only
    if: ${{ always() }}
    steps:
      # Every result in `needs` is consumed, so a job listed there can never be left out.
      - name: 📊 Require all CI checks to pass
        id: ci-checks
        uses: devantler-tech/.github/actions/aggregate-job-checks@cc156a3693019fdbe9817c46f1a91cd50a124695 # v21.7.3
        with:
          check-workflow-startup: "true"
          job-results: ${{ join(needs.*.result, ' ') }}
      # aggregate-job-checks deliberately tolerates skipped dependencies. A
      # stable required check must fail unless every listed job succeeded.
      - name: Reject incomplete CI jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
        shell: bash
      - name: Require workflow startup evidence
        if: ${{ steps.ci-checks.outputs.startup-clear != 'true' }}
        run: exit 1
        shell: bash
