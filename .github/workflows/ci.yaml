name: ✅ CI

on:
  pull_request:
    branches: [main]

permissions: {}

# template:begin
# scripts/scaffold.sh shapes this workflow once, when your repository is created:
# it replaces the placeholder `stack` job with the chosen stack's job and, without
# --tenancy, deletes the platform-tenant jobs and their `needs` entries.
# template:end
# This workflow is yours: keep it in `.templatesyncignore` so template-sync never
# overwrites it, and list every job you add under `ci-required-checks.needs`.
jobs:
  # stack:begin
  stack:
    name: Stack
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Placeholder
        run: echo "Replace this job with your stack's lint, test, and build steps."
  # stack:end

  # lint:begin
  # Shared MegaLinter checks for workflows, scripts, Dockerfiles, Markdown, YAML and
  # JSON. Go applications drop this job: the shared Go validator lints them.
  lint:
    name: Lint
    # GitHub's `$/` self-repository form fails actionlint until it supports it
    # (rhysd/actionlint#711); switch then.
    uses: ./.github/workflows/lint.yaml # zizmor: ignore[self-repository]
    permissions:
      contents: read
  # lint:end

  # tenancy:begin
  workflow-caller-pins:
    name: Workflow caller pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📌 Validate reusable workflow caller pins
        run: sh scripts/workflow-caller-pin-contract.test.sh
      # template:begin
      - name: Install released actionlint for the compatibility control
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "$archive" --directory "${RUNNER_TEMP}/actionlint-bin" actionlint
          echo "${RUNNER_TEMP}/actionlint-bin" >>"$GITHUB_PATH"
        shell: bash
      - name: Test concurrency queue validation
        run: bash scripts/validate-workflow-queues.test.sh
      # template:end

  # Validates the two tenant-owned artifacts that CD publishes: the image and deploy/.
  delivery-inputs:
    name: Delivery inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; tenant code runs without secrets or write authority
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐳 Build tenant image
        run: docker build --tag tenant-delivery-check .
        shell: bash
        working-directory: .
      - name: 🧱 Render tenant manifests
        run: kubectl kustomize deploy/ >/dev/null
        shell: bash
        working-directory: .

  # A dependency PR that moves the publish-app.yaml pin to a revision the platform has not approved
  # for this tenant would ship a release the platform refuses to deploy, so this job fails the move
  # here instead. An unchanged pin passes without contacting the platform. The template repository
  # itself is not a registered tenant, so it runs the check's tests but skips the check.
  publish-pin-approved:
    name: Publish pin approved
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🧪 Test the publish pin check
        run: sh scripts/publish-pin-approved.test.sh
      - name: 📌 Refuse an unapproved publish-app pin
        # The template repository, matched by its ID so the guard survives renames.
        if: github.repository_id != '1253884448'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # An empty base would turn `git show ":path"` into an index read, comparing the head with
          # itself and passing without checking anything.
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::No base commit to compare the publish-app pin against."
            exit 1
          fi
          # Run the check as it exists on the base branch: a PR must not be able to weaken the check
          # that judges it.
          git show "${BASE_SHA}:scripts/publish-pin-approved.sh" >"${RUNNER_TEMP}/publish-pin-approved.sh"
          git show "${BASE_SHA}:.github/workflows/cd.yaml" >"${RUNNER_TEMP}/base-cd.yaml"
          sh "${RUNNER_TEMP}/publish-pin-approved.sh" "${RUNNER_TEMP}/base-cd.yaml" .github/workflows/cd.yaml
  # tenancy:end

  # template:begin
  release-queue-proof:
    name: Release queue proof (${{ matrix.slot }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        slot: [first, second, third]
    concurrency:
      group: release-queue-proof-${{ github.run_id }}-${{ github.run_attempt }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Hold the publication slot while the other jobs queue
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          sleep 15
          printf '%s\n' "$SLOT" >"${RUNNER_TEMP}/queue-proof.txt"
        shell: bash
      - name: Publish the disposable queue receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-queue-proof-${{ matrix.slot }}
          path: ${{ runner.temp }}/queue-proof.txt
          if-no-files-found: error
          retention-days: 1
  release-queue-receipts:
    name: Release queue receipts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [release-queue-proof]
    permissions:
      actions: read # native workflow-run metadata only
    if: ${{ always() }}
    steps:
      - name: Require all three native publication slots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" |
            jq -e '[.[] | .jobs[] | select(.name | startswith("Release queue proof ("))] as $jobs |
              ($jobs | length) == 3 and
              ([$jobs[].name] | sort) == ["Release queue proof (first)", "Release queue proof (second)", "Release queue proof (third)"] and
              all($jobs[]; .status == "completed" and .conclusion == "success")'
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" |
            jq -e '[.[] | .artifacts[] | select(.name | startswith("release-queue-proof-"))] as $artifacts |
              ([$artifacts[].name] | sort) == ["release-queue-proof-first", "release-queue-proof-second", "release-queue-proof-third"] and
              all($artifacts[]; .expired == false and .size_in_bytes > 0)'
        shell: bash
  # template:end

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs:
      - stack
      - lint # lint
      - workflow-caller-pins # tenancy
      - delivery-inputs # tenancy
      - publish-pin-approved # tenancy
      # template:begin
      - release-queue-proof
      - release-queue-receipts
      # template:end
    permissions:
      actions: read # native workflow-run metadata only
    if: ${{ always() }}
    steps:
      # Every result in `needs` is consumed, so a job listed there can never be left out.
      - name: 📊 Require all CI checks to pass
        id: ci-checks
        uses: devantler-tech/.github/actions/aggregate-job-checks@d70d50665465117f01104313e53057374a96a1a3 # v21.7.2
        with:
          check-workflow-startup: "true"
          job-results: ${{ join(needs.*.result, ' ') }}
      # aggregate-job-checks deliberately tolerates skipped dependencies. A
      # stable required check must fail unless every listed job succeeded.
      - name: Reject incomplete CI jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
        shell: bash
      - name: Require workflow startup evidence
        if: ${{ steps.ci-checks.outputs.startup-clear != 'true' }}
        run: exit 1
        shell: bash
