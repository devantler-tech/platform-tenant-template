name: 🎉 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    # Skipped in the template repo itself; runs in every tenant created from it.
    if: github.repository != 'devantler-tech/platform-tenant-template'
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@0042076bbe7b0ae75a5bc5584333deecff9c5af5 # v20.1.19
    with:
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
