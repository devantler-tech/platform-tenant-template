version: 2
updates:
  # template:begin
  # scripts/scaffold.sh appends the chosen stack's ecosystem, deletes the docker entry
  # without --tenancy, and deletes every line and block marked `template`: those only keep
  # this template's own stack sources current.
  # template:end
  # This file is yours and listed in `.templatesyncignore`: add the ecosystems your
  # application needs here.
  - package-ecosystem: github-actions
    directories:
      - /
      - /stacks/go/.github/workflows # template
      - /stacks/dotnet/.github/workflows # template
      - /stacks/svelte/.github/workflows # template
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # `.releaserc` releases a patch for `build(deps)` commits, which is how runtime packages and
    # the base image reach production. Workflow updates change nothing the app serves, so they
    # use the `ci` prefix and release nothing.
    commit-message:
      prefix: "ci"
      include: "scope"
    # The devantler-tech callers (release, template-sync and, for a tenant, the publish-app
    # action) move together in one PR instead of one PR each. The publish-app action signs as
    # this repository, so a new revision needs no Platform approval (ADR 0017).
    groups:
      devantler-tech-actions:
        patterns:
          - "devantler-tech/*"
      # A group applies to EITHER version updates or security updates, never both, and the key
      # above defaults to `version-updates`, so this second group is what groups advisories.
      devantler-tech-actions-security:
        applies-to: security-updates
        patterns:
          - "devantler-tech/*"
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"

  # tenancy:begin
  - package-ecosystem: docker
    directories:
      - /
      - /stacks/go # template
      - /stacks/dotnet # template
      - /stacks/svelte # template
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
  # tenancy:end

  # template:begin
  - package-ecosystem: gomod
    directory: /stacks/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7

  - package-ecosystem: nuget
    directory: /stacks/dotnet
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /stacks/svelte
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # template:end
