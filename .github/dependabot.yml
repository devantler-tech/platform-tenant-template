version: 2
updates:
  # Baseline ecosystems shared by every tenant. Tenants whose stack needs more
  # ecosystems (e.g. npm, gomod, nuget) add them here and list this file in
  # `.templatesyncignore` so template-sync does not overwrite their additions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # The workflow-caller contract requires all three devantler-tech/actions callers to ride
    # ONE commit, so template-sync cannot carry one workflow forward while rolling another
    # back. Dependabot treats each reusable workflow as its own dependency, so UNGROUPED it
    # opens one PR per caller (#156, #157 and #158 each touched exactly one file) — and every
    # one of those lands with the other two still behind, failing that assertion in required
    # CI. No merge order rescues it: the first caller updated always disagrees with the rest.
    # Grouping advances all three in a single PR, which is the only shape that can go green.
    groups:
      devantler-tech-actions:
        patterns:
          - "devantler-tech/*"
      # A group applies to EITHER version updates or security updates, never both, and the key
      # above defaults to `version-updates`, so this second group is what covers advisories at all.
      # It is a best-effort improvement, NOT a guarantee, and must not be read as one: a security
      # group combines only the dependencies that actually HAVE an advisory, so if one caller is
      # affected and the others are not, Dependabot still opens a partial bump. The guarantee comes
      # from the coordinated path instead. Such a partial PR fails the shared-commit assertion and
      # is superseded by a SEPARATE pull request that moves all three callers to one reviewed SHA;
      # the bot's own PR is never touched, because AGENTS.md makes Dependabot-authored PRs
      # AUTOMATION-OWNED (NO-ACTION) — not reviewed, rebased, adapted, promoted or merged. So the
      # advisory still lands, through a coordinated PR rather than a split-fleet one.
      devantler-tech-actions-security:
        applies-to: security-updates
        patterns:
          - "devantler-tech/*"
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
